version: 2
updates:
  # api/requirements.in lists the direct dependencies; requirements.txt and
  # requirements-dev.txt are pip-compile locks (TA-ADR-025). Dependabot updates the .in and
  # recompiles the locks, so a transitive such as pydantic-core moves with its parent.
  - package-ecosystem: pip
    directory: /api
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  # app/pyproject.toml + app/uv.lock (ADR-010).
  - package-ecosystem: uv
    directory: /app
    schedule:
      interval: weekly
    target-branch: develop
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope

  # Keeps the SHA-pinned actions current; the version comment is updated with the SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: develop
    commit-message:
      prefix: ci

[project]
name = "itc-bench"
dynamic = ["version"]
description = "Bancada do técnico do Grupo ITC Brasil: preparação e diagnóstico de notebooks."
requires-python = "==3.13.*"
dependencies = ["PySide6==6.12.0"]

[project.scripts]
itc-bench = "itc_bench.__main__:main"

[dependency-groups]
build = [
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib==2026.9",
]
dev = [
    "ruff==0.17.3",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-qt==4.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/itc_bench/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/itc_bench"]

[tool.uv]
required-version = ">=0.12.17,<0.13"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "BLE", "SIM", "PTH", "TID", "RUF"]

allowed-confusables = ["›"]  # trilha "Grupo › Tela" do design

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"PySide6".msg = "Qt só em itc_bench/ui, no ponto de entrada e nos testes (ADR-010)."
"subprocess".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.system".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.popen".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.startfile".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"asyncio.create_subprocess_exec".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"asyncio.create_subprocess_shell".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.spawnl".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.spawnle".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.spawnlp".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.spawnlpe".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.spawnv".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.spawnve".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.spawnvp".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.spawnvpe".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.execl".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.execle".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.execlp".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.execlpe".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.execv".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.execve".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.execvp".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."
"os.execvpe".msg = "Processo externo só por itc_bench.servicos.executor (ADR-011)."

[tool.ruff.lint.per-file-ignores]
"src/itc_bench/ui/**" = ["TID251"]
"src/itc_bench/__main__.py" = ["TID251"]
"src/itc_bench/servicos/executor.py" = ["TID251"]
"tests/**" = ["TID251", "S101", "S603"]
"empacotamento/**" = ["TID251"]  # ferramenta de build (ícone), fora do app

[tool.mypy]
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
